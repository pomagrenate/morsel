name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: morsel
            asset_name: morsel-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: morsel
            asset_name: morsel-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: morsel
            asset_name: morsel-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: morsel
            asset_name: morsel-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: morsel.exe
            asset_name: morsel-windows-x86_64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: morsel.exe
            asset_name: morsel-windows-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create archive
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a ../../../${{ matrix.asset_name }}.zip ${{ matrix.artifact_name }}
          else
            tar czf ../../../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
          fi
          cd ../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          for dir in */; do
            cd "$dir"
            for file in *; do
              if [ -f "$file" ]; then
                sha256sum "$file" > "$file.sha256"
              fi
            done
            cd ..
          done
          cat */*.sha256 > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*/*.tar.gz
            artifacts/*/*.zip
            artifacts/*/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.SECRET_TOKEN }}

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Publish crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p morsel-core
          cargo publish -p morsel-clipboard
          cargo publish -p morsel-storage
          cargo publish -p morsel-search
          cargo publish -p morsel-platform
          cargo publish -p morsel-daemon
          cargo publish -p morsel-cli
          cargo publish -p morsel-tui

  publish-github:
    name: Publish to GitHub Packages
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish crates to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.SECRET_TOKEN }}
        run: |
          cargo login --registry github ${{ secrets.SECRET_TOKEN }}
          cargo publish -p morsel-core --registry github
          cargo publish -p morsel-clipboard --registry github
          cargo publish -p morsel-storage --registry github
          cargo publish -p morsel-search --registry github
          cargo publish -p morsel-platform --registry github
          cargo publish -p morsel-daemon --registry github
          cargo publish -p morsel-cli --registry github
          cargo publish -p morsel-tui --registry github
