[workspace]
members = [
    "crates/morsel-core",
    "crates/morsel-clipboard",
    "crates/morsel-storage",
    "crates/morsel-search",
    "crates/morsel-platform",
    "crates/morsel-daemon",
    "crates/morsel-cli",
    "crates/morsel-tui",
    "crates/morsel-desktop",
    "crates/morsel-benchmarks",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
authors = ["morsel contributors"]
license = "MIT"
repository = "https://github.com/pomagrenate/morsel"
homepage = "https://github.com/pomagrenate/morsel"
description = "A modern clipboard manager with search and retention capabilities"
readme = "README.md"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Error handling
thiserror = "1.0"
anyhow = "1.0"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Cryptography (for later phases)
aes-gcm = "0.10"
# CLI
clap = { version = "4.4", features = ["derive"] }
# TUI
ratatui = "0.25"
crossterm = "0.27"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = 3

[profile.dev]
opt-level = 0
