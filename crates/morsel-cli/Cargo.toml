[package]
name = "morsel-rs-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
readme.workspace = true

[[bin]]
name = "morsel"
path = "src/main.rs"

[dependencies]
morsel-core = { path = "../morsel-core", package = "morsel-rs-core", version = "0.1.0" }
morsel-clipboard = { path = "../morsel-clipboard", package = "morsel-rs-clipboard", version = "0.1.0" }
morsel-storage = { path = "../morsel-storage", package = "morsel-rs-storage", version = "0.1.0" }
morsel-search = { path = "../morsel-search", package = "morsel-rs-search", version = "0.1.0" }
morsel-platform = { path = "../morsel-platform", package = "morsel-rs-platform", version = "0.1.0" }
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "5.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
morsel-daemon = { path = "../morsel-daemon", package = "morsel-rs-daemon", version = "0.1.0" }
