[package]
name = "morsel-rs-clipboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
readme.workspace = true

[lib]
name = "morsel_clipboard"
path = "src/lib.rs"

[dependencies]
morsel-core = { path = "../morsel-core", package = "morsel-rs-core", version = "0.1.0" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
morsel-storage = { path = "../morsel-storage", package = "morsel-rs-storage", version = "0.1.0" }
tempfile = "3"

[[bench]]
name = "clipboard_bench"
harness = false
