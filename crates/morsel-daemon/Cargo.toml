[package]
name = "morsel-rs-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
readme.workspace = true

[lib]
name = "morsel_daemon"
path = "src/lib.rs"

[[bin]]
name = "morseld"
path = "src/main.rs"

[dependencies]
morsel-core = { path = "../morsel-core", package = "morsel-rs-core", version = "0.1.1" }
morsel-clipboard = { path = "../morsel-clipboard", package = "morsel-rs-clipboard", version = "0.1.1" }
morsel-storage = { path = "../morsel-storage", package = "morsel-rs-storage", version = "0.1.1" }
morsel-platform = { path = "../morsel-platform", package = "morsel-rs-platform", version = "0.1.1" }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
dirs = "5.0"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

[[bench]]
name = "daemon_bench"
harness = false
