[package]
name = "morsel-rs-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
readme.workspace = true

[[bin]]
name = "morsel-tui"
path = "src/main.rs"

[dependencies]
morsel-core = { path = "../morsel-core", package = "morsel-rs-core", version = "0.1.1" }
morsel-search = { path = "../morsel-search", package = "morsel-rs-search", version = "0.1.1" }
morsel-storage = { path = "../morsel-storage", package = "morsel-rs-storage", version = "0.1.1" }
morsel-clipboard = { path = "../morsel-clipboard", package = "morsel-rs-clipboard", version = "0.1.1" }
ratatui = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
unicode-width = "0.1"

[dev-dependencies]
